name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Folosește Maven Wrapper dacă e în repo; dacă nu, mvn
      - name: Build (first run, skip tests)
        run: |
          if [ -f ./mvnw ]; then
            ./mvnw -B -DskipTests package
          else
            mvn -B -DskipTests package
          fi
